# Static site, no build step. `public` is published; everything outside it
# (node_modules, tests, the QR tooling) stays off the web.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The wall lives at the root of photos.southhigh76.com. These keep the
# friendlier paths working, and match the URL if it ever moves under the
# main site.
[[redirects]]
  from = "/photos"
  to = "/"
  status = 301

[[redirects]]
  from = "/upload"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/tv"
  to = "/tv.html"
  status = 200
