<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reunion Photo Wall — Big Screen</title>
<meta name="robots" content="noindex">
<style>
:root{
  --green:#0F3E07;
  --green-dark:#06280B;
  --mint-soft:#CFE5BE;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#06120A;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  cursor:none;
}

/* Two stacked layers cross-fade, so there's never a blank frame between
   photos — one holds the current image while the next loads behind it. */
.stage{position:fixed;inset:0}
.layer{
  position:absolute;inset:0;opacity:0;
  transition:opacity 1.1s ease-in-out;
  display:flex;align-items:center;justify-content:center;
}
.layer.on{opacity:1}
.layer img{
  max-width:100%;max-height:100%;object-fit:contain;
  /* A slow drift stops a still photo from looking like a frozen screen. */
  animation:drift 14s ease-out forwards;
}
@keyframes drift{ from{transform:scale(1.0)} to{transform:scale(1.06)} }

/* A blurred copy of the same photo fills the letterboxing instead of black
   bars — portrait phone shots are the common case on a landscape screen. */
.layer .bg{
  position:absolute;inset:0;z-index:-1;
  background-size:cover;background-position:center;
  filter:blur(46px) brightness(.32) saturate(1.2);
  transform:scale(1.15);
}

.caption{
  position:fixed;left:0;right:0;bottom:0;z-index:3;
  padding:120px 6vw 5vh;
  background:linear-gradient(transparent,rgba(3,10,5,.88) 55%);
  opacity:0;transition:opacity .9s ease-in-out;
}
.caption.on{opacity:1}
.caption .text{font-size:clamp(20px,2.9vw,44px);font-weight:600;line-height:1.25;
  text-shadow:0 2px 18px rgba(0,0,0,.75);max-width:70vw}
.caption .by{font-size:clamp(14px,1.5vw,22px);color:var(--mint-soft);
  margin-top:12px;font-weight:700;letter-spacing:.02em}

/* Corner card: the screen advertises the QR, so watching turns into posting. */
/* A display rule in a class beats the browser's [hidden] styling, so state
   it explicitly — otherwise this card sits on top of the standby screen. */
.promo[hidden]{display:none}
.promo{
  position:fixed;right:2.4vw;bottom:2.4vw;z-index:4;
  background:#fff;color:var(--green);border-radius:14px;
  padding:14px 16px 12px;display:flex;align-items:center;gap:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);
}
.promo img{width:clamp(78px,7.5vw,124px);height:auto;display:block}
.promo .words{max-width:15ch}
.promo .big{font-size:clamp(13px,1.25vw,19px);font-weight:800;line-height:1.15}
.promo .small{font-size:clamp(10px,.85vw,13px);color:#40563a;margin-top:4px;font-weight:600}

.brand{
  position:fixed;left:2.4vw;top:2.4vw;z-index:4;
  font-size:clamp(11px,1vw,15px);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.62);font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.count{
  position:fixed;right:2.4vw;top:2.4vw;z-index:4;
  font-size:clamp(11px,1vw,15px);color:rgba(255,255,255,.55);font-weight:600;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}

/* "Just posted" flash — the moment that makes people keep scanning. */
.fresh{
  position:fixed;left:50%;top:3vh;transform:translate(-50%,-320%);z-index:5;
  opacity:0;
  background:var(--green);color:#fff;border:1px solid rgba(255,255,255,.28);
  padding:11px 24px;border-radius:99px;font-weight:800;
  font-size:clamp(13px,1.3vw,20px);letter-spacing:.02em;
  transition:transform .5s cubic-bezier(.2,1.3,.4,1), opacity .3s ease;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.fresh.on{transform:translate(-50%,0);opacity:1}

.empty{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:6vw;gap:18px;
}
.empty h1{font-size:clamp(26px,4.4vw,64px);font-weight:800}
.empty p{font-size:clamp(15px,1.7vw,26px);color:var(--mint-soft);max-width:24ch}
.empty img{width:min(30vw,300px);background:#fff;padding:16px;border-radius:16px;margin-top:8px}
.empty.gone{display:none}
</style>
</head>
<body>

<div class="stage">
  <div class="layer" id="a"><div class="bg"></div><img alt=""></div>
  <div class="layer" id="b"><div class="bg"></div><img alt=""></div>
</div>

<div class="empty" id="empty">
  <h1>Reunion Photo Wall</h1>
  <p>Scan to put your photos on this screen</p>
  <img src="/reunion-qr.svg" alt="Scan to add photos">
  <p style="font-size:clamp(13px,1.3vw,20px)">photos.southhigh76.com</p>
</div>

<div class="brand">South High &middot; Class of 1976</div>
<div class="count" id="count"></div>

<div class="caption" id="caption">
  <div class="text" id="captext"></div>
  <div class="by" id="capby"></div>
</div>

<div class="promo" id="promo" hidden>
  <img src="/reunion-qr.svg" alt="Scan to add your photos">
  <div class="words">
    <div class="big">Add your photos</div>
    <div class="small">photos.southhigh76.com</div>
  </div>
</div>

<div class="fresh" id="fresh"></div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };

  var HOLD  = 8000;    // ms a photo stays up
  var POLL  = 15000;   // ms between checks for new photos
  var photos = [];     // everything on the wall, newest first
  var seen   = {};     // ids already loaded, so polls only surface new ones
  var queue  = [];     // freshly posted, jump the line
  var order  = [];     // shuffled cycle through the back catalogue
  var oi     = 0;
  var layers = [$("a"), $("b")];
  var active = 0;
  var timer  = null;
  var started = false;

  function esc(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function reshuffle(){
    order = shuffle(photos.map(function(p){ return p.id; }));
    oi = 0;
  }

  function byId(id){
    for (var i = 0; i < photos.length; i++) if (photos[i].id === id) return photos[i];
    return null;
  }

  // Pick what to show: anything just posted first, otherwise keep cycling.
  function nextPhoto(){
    while (queue.length){
      var p = queue.shift();
      if (byId(p.id)) return { photo: p, fresh: true };
    }
    if (!photos.length) return null;
    if (oi >= order.length) reshuffle();
    var found = null;
    while (oi < order.length && !found) found = byId(order[oi++]);
    return found ? { photo: found, fresh: false } : null;
  }

  function flash(text){
    var el = $("fresh");
    el.textContent = text;
    el.className = "fresh on";
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.className = "fresh"; }, 4200);
  }

  function show(){
    var pick = nextPhoto();
    if (!pick){ timer = setTimeout(show, 2000); return; }

    var p = pick.photo;
    var next = layers[1 - active];
    var img = next.querySelector("img");
    var bg = next.querySelector(".bg");

    var loader = new Image();

    loader.onload = function(){
      img.src = p.url;
      bg.style.backgroundImage = 'url("' + p.url + '")';

      // Restart the drift animation for the incoming photo.
      img.style.animation = "none";
      void img.offsetWidth;
      img.style.animation = "";

      $("captext").textContent = p.caption || "";
      $("capby").textContent = p.name ? "Shared by " + p.name : "";
      $("caption").className = (p.caption || p.name) ? "caption on" : "caption";

      next.className = "layer on";
      layers[active].className = "layer";
      active = 1 - active;

      $("empty").className = "empty gone";
      $("promo").hidden = false;

      if (pick.fresh) flash("Just posted — " + (p.name || "someone"));

      timer = setTimeout(show, HOLD);
    };

    loader.onerror = function(){
      // A photo the browser can't decode (an unconverted HEIC) must never
      // sit as a broken frame on a projector — drop it and move on.
      photos = photos.filter(function(x){ return x.id !== p.id; });
      timer = setTimeout(show, 60);
    };

    loader.src = p.url;
  }

  function fetchAll(){
    var acc = [], cursor = null;
    function step(){
      var url = "/api/photos" + (cursor ? "?before=" + encodeURIComponent(cursor) : "");
      return fetch(url).then(function(r){ return r.json(); }).then(function(d){
        acc = acc.concat(d.photos);
        cursor = d.nextCursor;
        return cursor ? step() : acc;
      });
    }
    return step();
  }

  function refresh(){
    return fetchAll().then(function(list){
      var added = [];
      list.forEach(function(p){
        if (!seen[p.id]){ seen[p.id] = true; added.push(p); }
      });

      photos = list;
      $("count").textContent = list.length
        ? list.length + " photo" + (list.length === 1 ? "" : "s")
        : "";

      // Newly posted photos go to the front of the queue, newest last so
      // they play in the order they were taken.
      if (started && added.length){
        queue = queue.concat(added.slice().reverse());
      }
      if (!order.length || order.length !== list.length) reshuffle();

      if (!started && list.length){
        started = true;
        clearTimeout(timer);
        show();
      }
    }).catch(function(){ /* a dropped poll just retries on the next tick */ });
  }

  refresh();
  setInterval(refresh, POLL);

  // Let someone tap or press a key to skip ahead, and space to pause.
  var paused = false;
  document.addEventListener("keydown", function(e){
    if (e.key === " "){
      e.preventDefault();
      paused = !paused;
      if (paused) clearTimeout(timer); else show();
    } else if (e.key === "ArrowRight" && !paused){
      clearTimeout(timer); show();
    }
  });
  document.addEventListener("click", function(){
    if (!paused && started){ clearTimeout(timer); show(); }
  });
})();
</script>
</body>
</html>
